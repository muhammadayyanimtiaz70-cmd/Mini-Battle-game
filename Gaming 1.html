<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>Mini Battle Royale Mobile</title>

<style>
* {
    box-sizing: border-box;
    touch-action: none;
}

body {
    margin: 0;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
    background: #4b8f3c;
}

#info {
    position: fixed;
    top: 10px;
    left: 10px;
    color: white;
    background: rgba(0,0,0,0.65);
    padding: 8px 12px;
    border-radius: 8px;
    z-index: 5;
    font-size: 15px;
}

/* Joystick */

#joystick {
    position: fixed;
    left: 30px;
    bottom: 35px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 3px solid rgba(255,255,255,0.45);
    z-index: 10;
}

#stick {
    position: absolute;
    width: 60px;
    height: 60px;
    left: 32px;
    top: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.65);
}

/* Fire button */

#fireButton {
    position: fixed;
    right: 35px;
    bottom: 45px;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    background: rgba(220,30,30,0.75);
    border: 4px solid rgba(255,255,255,0.7);
    color: white;
    font-size: 20px;
    font-weight: bold;
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Game Over */

#gameOver {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    color: white;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 20;
    text-align: center;
}

#gameOver h1 {
    font-size: 45px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
}

@media (min-width: 800px) {
    #joystick,
    #fireButton {
        opacity: 0.5;
    }
}
</style>
</head>

<body>

<div id="info">
❤️ <span id="health">100</span>
&nbsp;&nbsp;
🎯 <span id="score">0</span>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<div id="fireButton">
    🔫 FIRE
</div>

<div id="gameOver">

    <h1 id="result">GAME OVER</h1>

    <p>
        Score:
        <span id="finalScore">0</span>
    </p>

    <button onclick="location.reload()">
        Play Again
    </button>

</div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   GAME VARIABLES
========================= */

let bullets = [];
let enemies = [];

let score = 0;
let gameRunning = true;

const player = {

    x: canvas.width / 2,
    y: canvas.height / 2,

    size: 22,

    speed: 5,

    health: 100,

    angle: 0
};


/* =========================
   TOUCH CONTROLS
========================= */

let joystickX = 0;
let joystickY = 0;

let joystickActive = false;

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

const fireButton =
    document.getElementById("fireButton");


function joystickMove(e) {

    e.preventDefault();

    const touch = e.touches[0];

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    let dx = touch.clientX - centerX;
    let dy = touch.clientY - centerY;

    const maxDistance = 45;

    const distance =
        Math.sqrt(dx * dx + dy * dy);

    if (distance > maxDistance) {

        dx =
            dx / distance * maxDistance;

        dy =
            dy / distance * maxDistance;

    }

    joystickX = dx / maxDistance;
    joystickY = dy / maxDistance;

    stick.style.transform =
        `translate(${dx}px, ${dy}px)`;
}


function joystickStart(e) {

    joystickActive = true;

    joystickMove(e);
}


function joystickEnd() {

    joystickActive = false;

    joystickX = 0;
    joystickY = 0;

    stick.style.transform =
        "translate(0px, 0px)";
}


joystick.addEventListener(
    "touchstart",
    joystickStart,
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    joystickMove,
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    joystickEnd
);


/* =========================
   AIMING
========================= */

let aimX = canvas.width / 2;
let aimY = canvas.height / 2;

canvas.addEventListener(
    "touchmove",
    function(e) {

        if (e.touches.length > 0) {

            const touch =
                e.touches[0];

            aimX = touch.clientX;
            aimY = touch.clientY;

        }

    },
    {passive:false}
);


/* =========================
   SHOOTING
========================= */

function shoot() {

    if (!gameRunning) return;

    let angle =
        player.angle;

    bullets.push({

        x: player.x,

        y: player.y,

        dx: Math.cos(angle) * 11,

        dy: Math.sin(angle) * 11,

        size: 5

    });

}


let firing = false;

fireButton.addEventListener(
    "touchstart",
    function(e) {

        e.preventDefault();

        firing = true;

        shoot();

    },
    {passive:false}
);

fireButton.addEventListener(
    "touchend",
    function(e) {

        e.preventDefault();

        firing = false;

    },
    {passive:false}
);


/* =========================
   ENEMIES
========================= */

function createEnemy() {

    let side =
        Math.floor(Math.random() * 4);

    let x;
    let y;

    if (side === 0) {

        x = Math.random() * canvas.width;
        y = -30;

    }

    if (side === 1) {

        x = canvas.width + 30;
        y = Math.random() * canvas.height;

    }

    if (side === 2) {

        x = Math.random() * canvas.width;
        y = canvas.height + 30;

    }

    if (side === 3) {

        x = -30;
        y = Math.random() * canvas.height;

    }

    enemies.push({

        x: x,
        y: y,

        size: 21,

        speed:
            1.3 + Math.random(),

        health: 2

    });

}


setInterval(function() {

    if (
        gameRunning &&
        enemies.length < 12
    ) {

        createEnemy();

    }

}, 900);


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer() {

    player.x +=
        joystickX * player.speed;

    player.y +=
        joystickY * player.speed;

    player.x =
        Math.max(
            player.size,
            Math.min(
                canvas.width - player.size,
                player.x
            )
        );

    player.y =
        Math.max(
            player.size,
            Math.min(
                canvas.height - player.size,
                player.y
            )
        );

}


/* =========================
   BULLET UPDATE
========================= */

function updateBullets() {

    bullets.forEach(
        (bullet, bIndex) => {

        bullet.x += bullet.dx;
        bullet.y += bullet.dy;

        if (

            bullet.x < -20 ||
            bullet.x >
                canvas.width + 20 ||
            bullet.y < -20 ||
            bullet.y >
                canvas.height + 20

        ) {

            bullets.splice(bIndex, 1);

            return;

        }


        enemies.forEach(
            (enemy, eIndex) => {

            let distance =
                Math.hypot(
                    bullet.x - enemy.x,
                    bullet.y - enemy.y
                );

            if (
                distance <
                enemy.size +
                bullet.size
            ) {

                enemy.health--;

                bullets.splice(
                    bIndex,
                    1
                );

                if (
                    enemy.health <= 0
                ) {

                    enemies.splice(
                        eIndex,
                        1
                    );

                    score += 10;

                    document
                        .getElementById("score")
                        .textContent =
                        score;

                }

            }

        });

    });

}


/* =========================
   ENEMY UPDATE
========================= */

function updateEnemies() {

    enemies.forEach(enemy => {

        let angle =
            Math.atan2(
                player.y - enemy.y,
                player.x - enemy.x
            );

        enemy.x +=
            Math.cos(angle) *
            enemy.speed;

        enemy.y +=
            Math.sin(angle) *
            enemy.speed;


        let distance =
            Math.hypot(
                player.x - enemy.x,
                player.y - enemy.y
            );


        if (
            distance <
            player.size +
            enemy.size
        ) {

            player.health -= 0.5;

            document
                .getElementById("health")
                .textContent =
                Math.max(
                    0,
                    Math.floor(
                        player.health
                    )
                );


            if (
                player.health <= 0
            ) {

                gameOver(false);

            }

        }

    });

}


/* =========================
   BACKGROUND
========================= */

function drawBackground() {

    ctx.fillStyle =
        "#4b8f3c";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    ctx.fillStyle =
        "#438335";


    for (
        let x = 0;
        x < canvas.width;
        x += 50
    ) {

        for (
            let y = 0;
            y < canvas.height;
            y += 50
        ) {

            ctx.fillRect(
                x + 10,
                y + 10,
                3,
                3
            );

        }

    }


    /* Buildings */

    ctx.fillStyle =
        "#777";

    ctx.fillRect(
        80,
        130,
        150,
        100
    );


    ctx.fillRect(
        canvas.width - 230,
        160,
        150,
        100
    );

}


/* =========================
   PLAYER DRAW
========================= */

function drawPlayer() {

    ctx.save();


    ctx.translate(
        player.x,
        player.y
    );


    ctx.rotate(
        player.angle
    );


    /* Body */

    ctx.fillStyle =
        "#2196f3";

    ctx.fillRect(
        -18,
        -18,
        36,
        36
    );


    /* Gun */

    ctx.fillStyle =
        "#222";

    ctx.fillRect(
        10,
        -5,
        38,
        10
    );


    ctx.restore();

}


/* =========================
   ENEMY DRAW
========================= */

function drawEnemies() {

    enemies.forEach(enemy => {

        ctx.fillStyle =
            "#e53935";


        ctx.beginPath();

        ctx.arc(
            enemy.x,
            enemy.y,
            enemy.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /* Health */

        ctx.fillStyle =
            "black";

        ctx.fillRect(
            enemy.x - 20,
            enemy.y - 31,
            40,
            5
        );


        ctx.fillStyle =
            "lime";

        ctx.fillRect(
            enemy.x - 20,
            enemy.y - 31,
            enemy.health * 20,
            5
        );

    });

}


/* =========================
   BULLET DRAW
========================= */

function drawBullets() {

    bullets.forEach(
        bullet => {

        ctx.fillStyle =
            "yellow";

        ctx.beginPath();

        ctx.arc(
            bullet.x,
            bullet.y,
            bullet.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    });

}


/* =========================
   GAME OVER
========================= */

function gameOver(win) {

    gameRunning = false;

    document
        .getElementById("gameOver")
        .style.display =
        "flex";


    document
        .getElementById("result")
        .textContent =
        win
        ? "🏆 YOU WIN!"
        : "💀 GAME OVER";


    document
        .getElementById("finalScore")
        .textContent =
        score;

}


/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    if (!gameRunning)
        return;


    updatePlayer();

    updateBullets();

    updateEnemies();


    /* Player aims toward
       last touch position */

    player.angle =
        Math.atan2(
            aimY - player.y,
            aimX - player.x
        );


    /* Auto fire */

    if (firing) {

        shoot();

    }


    drawBackground();

    drawBullets();

    drawEnemies();

    drawPlayer();


    requestAnimationFrame(
        gameLoop
    );

}


gameLoop();

</script>

</body>
</html>
